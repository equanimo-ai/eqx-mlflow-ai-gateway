# Build and deploy the MLflow AI Gateway (dev only; workflow_dispatch only).
#
# Terraform (infra/terraform) owns config; this workflow owns code: it pushes the
# image, runs the DB bootstrap and migrate one-off tasks, then points the service
# at a new task-definition revision (the service module ignores task_definition).
#
# Repository variables required (same convention as the other equanimo repos):
#   AWS_ACCOUNT_ID_DEV         169802850860
#   AWS_DEPLOY_ROLE_NAME_DEV   OIDC deploy role; its trust policy must allow this repo.
#                              Needs ecr push/describe, ecs register/run/describe/update,
#                              iam:PassRole for the task roles.
#
# Resource names are the dev defaults from infra/terraform (outputs.tf), kept in the
# env block below instead of running `terraform init` here.
name: AI Gateway deploy (dev)

on:
  workflow_dispatch:

permissions: {}

cache-mode: none

# A deploy must finish; never cancel one mid-flight.
concurrency:
  group: ai-gateway-deploy-dev
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: eqx-mlflow-gateway
  ECS_CLUSTER: eqx-shared-services
  ECS_SERVICE: eqx-mlflow-gateway
  TASK_FAMILY: eqx-mlflow-gateway
  BOOTSTRAP_FAMILY: eqx-mlflow-gateway-db-bootstrap

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_DEV }}:role/${{ vars.AWS_DEPLOY_ROLE_NAME_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and push image
        id: image
        run: |
          REGISTRY="${{ vars.AWS_ACCOUNT_ID_DEV }}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          TAG="${GITHUB_SHA::12}"
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$TAG"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          # Tags are immutable: a re-run on the same commit reuses the pushed image.
          if aws ecr describe-images --region "$AWS_REGION" --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$TAG" >/dev/null 2>&1; then
            echo "$IMAGE already exists; skipping build and push"
            exit 0
          fi
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$REGISTRY"
          docker build --platform linux/amd64 -f docker/ai-gateway/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Define one-off task helper
        run: |
          cat > "$RUNNER_TEMP/run_task.sh" <<'SCRIPT'
          # usage: run_task.sh <task-definition> <container-name> <command-override-json|""> <network-config-json>
          set -euo pipefail
          TASKDEF="$1"; CONTAINER="$2"; COMMAND="$3"; NETWORK="$4"
          ARGS=(--region "$AWS_REGION" --cluster "$ECS_CLUSTER" --launch-type FARGATE
            --task-definition "$TASKDEF" --network-configuration "$NETWORK")
          if [ -n "$COMMAND" ]; then
            ARGS+=(--overrides "$(jq -nc --arg n "$CONTAINER" --argjson c "$COMMAND" \
              '{containerOverrides: [{name: $n, command: $c}]}')")
          fi
          TASK_ARN=$(aws ecs run-task "${ARGS[@]}" --query 'tasks[0].taskArn' --output text)
          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = None ]; then
            echo "::error::run-task did not start a task for $TASKDEF"
            exit 1
          fi
          echo "Started $TASK_ARN; waiting for it to stop"
          aws ecs wait tasks-stopped --region "$AWS_REGION" --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
          CODE=$(aws ecs describe-tasks --region "$AWS_REGION" --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query "tasks[0].containers[?name=='$CONTAINER'].exitCode | [0]" --output text)
          if [ "$CODE" != 0 ]; then
            REASON=$(aws ecs describe-tasks --region "$AWS_REGION" --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
              --query 'tasks[0].stoppedReason' --output text)
            echo "::error::$TASKDEF exited with code '$CODE' (stopped reason: $REASON). Check the CloudWatch logs of $TASK_ARN."
            exit 1
          fi
          echo "$TASKDEF finished with exit code 0"
          SCRIPT

      # One-off tasks reuse the service's subnets and security groups (service SG plus
      # the DB client SG), with no public IP.
      - name: Read service network configuration
        id: net
        run: |
          NETWORK=$(aws ecs describe-services --region "$AWS_REGION" --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].networkConfiguration.awsvpcConfiguration' --output json |
            jq -c '{awsvpcConfiguration: {subnets: .subnets, securityGroups: .securityGroups, assignPublicIp: "DISABLED"}}')
          echo "network=$NETWORK" >> "$GITHUB_OUTPUT"

      - name: Run DB bootstrap task
        env:
          NETWORK: ${{ steps.net.outputs.network }}
        run: |
          CONTAINER=$(aws ecs describe-task-definition --region "$AWS_REGION" \
            --task-definition "$BOOTSTRAP_FAMILY" \
            --query 'taskDefinition.containerDefinitions[0].name' --output text)
          bash "$RUNNER_TEMP/run_task.sh" "$BOOTSTRAP_FAMILY" "$CONTAINER" "" "$NETWORK"

      - name: Register new task definition revision
        id: taskdef
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          aws ecs describe-task-definition --region "$AWS_REGION" --task-definition "$TASK_FAMILY" \
            --query taskDefinition --output json > "$RUNNER_TEMP/current.json"
          jq --arg image "$IMAGE" '
            .containerDefinitions[0].image = $image
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                  .registeredAt, .registeredBy, .deregisteredAt)
          ' "$RUNNER_TEMP/current.json" > "$RUNNER_TEMP/new.json"
          echo "container=$(jq -r '.containerDefinitions[0].name' "$RUNNER_TEMP/new.json")" >> "$GITHUB_OUTPUT"
          ARN=$(aws ecs register-task-definition --region "$AWS_REGION" \
            --cli-input-json "file://$RUNNER_TEMP/new.json" \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "Registered $ARN"

      - name: Run migrate task
        env:
          NETWORK: ${{ steps.net.outputs.network }}
          TASK_ARN: ${{ steps.taskdef.outputs.arn }}
          CONTAINER: ${{ steps.taskdef.outputs.container }}
        run: |
          bash "$RUNNER_TEMP/run_task.sh" "$TASK_ARN" "$CONTAINER" '["migrate"]' "$NETWORK"

      - name: Update service
        env:
          TASK_ARN: ${{ steps.taskdef.outputs.arn }}
        run: |
          aws ecs update-service --region "$AWS_REGION" --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$TASK_ARN" >/dev/null
          aws ecs wait services-stable --region "$AWS_REGION" --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Assert new revision is the completed primary deployment
        env:
          TASK_ARN: ${{ steps.taskdef.outputs.arn }}
        run: |
          read -r DESIRED PRIMARY STATE < <(aws ecs describe-services --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query "services[0].[desiredCount, deployments[?status=='PRIMARY']|[0].taskDefinition, deployments[?status=='PRIMARY']|[0].rolloutState]" \
            --output text)
          if [ "$DESIRED" = "0" ]; then
            echo "::error::desiredCount is 0; the service is in its off-hours window, nothing was deployed"
            exit 1
          fi
          if [ "$PRIMARY" != "$TASK_ARN" ] || [ "$STATE" != "COMPLETED" ]; then
            echo "::error::PRIMARY=$PRIMARY rolloutState=$STATE; expected $TASK_ARN COMPLETED (rolled back or failed)"
            exit 1
          fi

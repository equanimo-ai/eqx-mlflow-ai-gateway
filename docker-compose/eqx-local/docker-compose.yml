# Local dependencies for the Equanimo MLflow AI Gateway. Development only: the credentials below
# are public and every port is bound to loopback.
name: eqx-mlflow-local

volumes:
  pgdata:

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow-dev-only
      POSTGRES_DB: mlflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Stands in for AWS Kinesis (usage events) and SQS (policy actions).
  localstack:
    image: localstack/localstack:4.4
    environment:
      SERVICES: kinesis,sqs
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./localstack-init.sh:/etc/localstack/init/ready.d/10-create-resources.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/eqx-resources-ready"]
      interval: 5s
      timeout: 3s
      retries: 30
